COMMON_FLAGS="-O2 -pipe -march=znver4"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j16 -l16"

EMERGE_DEFAULT_OPTS="--ask --verbose --jobs=4 --load-average=16 --with-bdeps=y"
FEATURES="parallel-fetch parallel-install unmerge-orphans buildpkg"

# Desktop / X11 (dwm)
USE="X gtk xft fontconfig dbus -wayland"
# Graphics
USE="${USE} opengl vulkan vaapi"
# Audio
USE="${USE} pipewire pulseaudio alsa"
# Networking
USE="${USE} networkmanager wifi bluetooth"
# System
USE="${USE} dist-kernel"
# Not wanted
USE="${USE} -gnome -kde -nvidia -cuda -cups -doc"

VIDEO_CARDS="amdgpu radeonsi"
AMDGPU_TARGETS="gfx1102 gfx1103"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
ACCEPT_KEYWORDS="~amd64"

LC_MESSAGES=C.UTF-8
