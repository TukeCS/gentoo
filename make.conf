# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe -march=znver4"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j16 -l16"

EMERGE_DEFAULT_OPTS="--ask --verbose --jobs=4 --load-average=16 --with-bdeps=y"
FEATURES="parallel-fetch parallel-install unmerge-orphans buildpkg"

# Desktop / X11 (dwm)
USE="X gtk xft fontconfig dbus -wayland"
# Graphics
USE="${USE} opengl vulkan vaapi"
# Audio
USE="${USE} pipewire pulseaudio alsa"
# Networking
USE="${USE} networkmanager wifi bluetooth"
# System
USE="${USE} dist-kernel"
# Not wanted
USE="${USE} -gnome -kde -nvidia -cuda -cups -doc"

VIDEO_CARDS="amdgpu radeonsi"
AMDGPU_TARGETS="gfx1102 gfx1103"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
ACCEPT_KEYWORDS="~amd64"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

GENTOO_MIRRORS="https://pkg.adfinis-on-exoscale.ch/gentoo/ \
    http://ftp.free.fr/mirrors/ftp.gentoo.org/ \
    https://ch.mirrors.cicku.me/gentoo/ \
    https://mirror.init7.net/gentoo/ \
    https://ftp.fau.de/gentoo"
